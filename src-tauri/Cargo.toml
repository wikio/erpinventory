[package]
name = "sari-systeme"
version = "1.0.0"
description = "SARI Système ERP desktop shell"
authors = ["SARI Système Team"]
edition = "2021"

[lib]
name = "sari_systeme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
